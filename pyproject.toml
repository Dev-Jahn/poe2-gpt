[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poe2-gpt"
version = "0.14.1"
description = "PoE2 prices, trade search and private Path of Building analysis via MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jahn"}]
keywords = ["poe2", "mcp", "chatgpt", "path-of-building"]
requires-python = ">=3.11"
dependencies = ["mcp==2.2.0", "httpx[socks]==0.28.1", "defusedxml==0.7.1", "PyJWT[crypto]==2.13.0", "cryptography>=46,<51"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
quality = ["ruff==0.15.1", "mypy==1.19.1", "pytest-cov==7.0.0"]

[project.urls]
Homepage = "https://github.com/Dev-Jahn/poe2-gpt"
Repository = "https://github.com/Dev-Jahn/poe2-gpt"
Issues = "https://github.com/Dev-Jahn/poe2-gpt/issues"

[project.scripts]
poe2-gpt = "poe2_companion.server:main"
poe2-companion = "poe2_companion.server:main"
poe2-companion-check = "poe2_companion.check:main"
poe2-character-provider = "poe2_companion.character_provider:main"
poe2-account-broker = "poe2_companion.account_broker:main"
poe2-pob-worker = "poe2_companion.engine_worker:main"
poe2-equipment-import = "poe2_companion.equipment_io:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
poe2_companion = ["lua/*.lua", "data/*.json"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
files = ["src/poe2_companion"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["poe2_companion.inspection", "poe2_companion.diagnostics", "poe2_companion.recommendation", "poe2_companion.accounts", "poe2_companion.account_store", "poe2_companion.account_oauth", "poe2_companion.account_broker", "poe2_companion.account_ui"]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["poe2_companion.capabilities", "poe2_companion.profiles", "poe2_companion.catalog", "poe2_companion.catalog_models", "poe2_companion.subjects", "poe2_companion.experiment_models", "poe2_companion.workflows", "poe2_companion.workflow_store", "poe2_companion.observations", "poe2_companion.skill_components", "poe2_companion.passive_portfolio", "poe2_companion.passive_candidates", "poe2_companion.passive_execution", "poe2_companion.plan_exports", "poe2_companion.support_portfolio", "poe2_companion.plan_dependencies", "poe2_companion.item_transforms", "poe2_companion.risk_analysis", "poe2_companion.recovery", "poe2_companion.native_recovery", "poe2_companion.execution_plans", "poe2_companion.rollback_plans", "poe2_companion.purchases", "poe2_companion.workflow_telemetry", "poe2_companion.economy_analysis", "poe2_companion.guide_provider", "poe2_companion.progression"]
check_untyped_defs = true

[tool.coverage.run]
source = ["poe2_companion"]

[tool.coverage.report]
fail_under = 85
show_missing = true
