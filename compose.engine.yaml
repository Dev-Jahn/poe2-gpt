# Optional private computation service. No worker TCP port or network access.
services:
  poe2-companion:
    environment:
      POE2_ENGINE_SOCKET: /engine-socket/pob.sock
    volumes:
      - engine-socket:/engine-socket:ro
    depends_on:
      pob-engine:
        condition: service_healthy
  pob-engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    restart: unless-stopped
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    cpus: 2
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    volumes:
      - engine-socket:/engine-socket
      - type: bind
        source: ${POE2_HOST_PRIVATE_DIR:?Set the absolute private PoB directory}
        target: /private-builds
        read_only: true
        bind:
          create_host_path: false
    environment:
      POE2_PRIVATE_DIR: /private-builds
      POE2_ENGINE_DIR: /opt/pob
      POE2_ENGINE_SOCKET: /engine-socket/pob.sock
    healthcheck:
      test: [CMD, python, -c, "import httpx; c=httpx.Client(transport=httpx.HTTPTransport(uds='/engine-socket/pob.sock')); c.get('http://pob-worker/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  engine-socket:
