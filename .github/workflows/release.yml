name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate tag and source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check_release.py
          python -c 'import os,tomllib; p=tomllib.load(open("pyproject.toml","rb")); assert os.environ["RELEASE_TAG"] == "v" + p["project"]["version"]'
      - run: python -m pip install build
      - run: python -m build
      - name: Create plugin archive and checksums
        run: |
          git archive --format=zip --prefix=poe2-gpt/ --output=dist/poe2-gpt-plugin.zip HEAD
          cd dist
          sha256sum *.whl *.tar.gz *.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "POE2 GPT $RELEASE_TAG" --notes-file CHANGELOG.md
  containers:
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: poe2-gpt
            file: Dockerfile
            arch: amd64
            runner: ubuntu-latest
          - image: poe2-gpt-engine
            file: Dockerfile.engine
            arch: amd64
            runner: ubuntu-latest
          - image: poe2-gpt
            file: Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: poe2-gpt-engine
            file: Dockerfile.engine
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate tag and normalize owner
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os,tomllib; p=tomllib.load(open("pyproject.toml","rb")); assert os.environ["RELEASE_TAG"] == "v" + p["project"]["version"]'
          printf 'OWNER_LOWER=%s\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/${{ matrix.arch }}
          provenance: true
          sbom: true
          tags: ghcr.io/${{ env.OWNER_LOWER }}/${{ matrix.image }}:${{ github.ref_name }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
  manifests:
    needs: containers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [poe2-gpt, poe2-gpt-engine]
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          image_ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:${RELEASE_TAG}"
          docker buildx imagetools create --tag "$image_ref" "$image_ref-amd64" "$image_ref-arm64"
