name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]' build
      - run: python scripts/check_release.py
      - run: python -m pytest -q -rs
      - run: python -m build
      - name: Check optional Compose configuration
        env:
          POE2_HOST_PRIVATE_DIR: /tmp/poe2-private
          POE2_HOST_PROJECTION_DIR: /tmp/poe2-projections
          POE2_HOST_EQUIPMENT_DIR: /tmp/poe2-equipment
        run: docker compose -f compose.yaml -f compose.engine.yaml -f compose.builds.yaml -f compose.equipment.yaml config --quiet
      - name: Build MCP image
        if: matrix.python == '3.12'
        run: docker build --tag poe2-gpt:ci .
  engine:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build pinned real-engine test image
        run: docker build --file Dockerfile.engine --target test --tag poe2-gpt-engine:test .
      - name: Test the real engine without external network access
        run: docker run --rm --network none --entrypoint python poe2-gpt-engine:test scripts/run_engine_tests.py
      - name: Test Mac deployment containers and private import
        run: python3 scripts/check_mac_containers.py
